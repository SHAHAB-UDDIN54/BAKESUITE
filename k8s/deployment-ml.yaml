apiVersion: apps/v1
kind: Deployment
metadata:
  name: bakesuite-ml-service
  namespace: bakesuite
  labels:
    app.kubernetes.io/name: ml-service
    app.kubernetes.io/part-of: bakesuite-erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ml-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml-service
    spec:
      containers:
        - name: ml-service
          image: bakesuite-ml-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bakesuite-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://bakesuite-redis:6379/0"
            - name: USE_MOCK_CACHE
              value: "false"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: bakesuite-ml-service
  namespace: bakesuite
  labels:
    app.kubernetes.io/name: ml-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: ml-service
